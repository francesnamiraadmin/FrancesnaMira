<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ambiente de Produção - Francês na Mira</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Página retirada de circulação: o Ambiente de Produção começa no accueil (producao.html);
     a correção de uma produção abre em minha-correcao.html. Links antigos são redirecionados. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var producao = q.get("producao"), curso = q.get("curso");
  location.replace(producao ? "minha-correcao.html?producao=" + encodeURIComponent(producao)
    : "producao.html" + (curso ? "?curso=" + encodeURIComponent(curso) : ""));
})();
</script>
</head>
<body><p style="font-family:sans-serif;text-align:center;padding:40px;"><a href="producao.html">Ir para o Ambiente de Produção</a></p></body>
</html>
