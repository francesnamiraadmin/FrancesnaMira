<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo-mira.png">
<title>Ambiente de Produção - Francês na Mira</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/course-hub.css">

<style>
html { scroll-behavior: smooth; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', sans-serif; }
footer { text-align: center; padding: 28px; background: var(--footer-bg); margin-top: 40px; }
</style>
</head>

<body>
<div id="app-navbar" class="app-navbar-bar"></div>

<section class="hub-intro">
  <h1>Ambiente de Produção Oral e Textual</h1>
  <p>Escolha o curso para enviar redações e produções orais para correção, com feedback detalhado por critério, histórico e mensagens com o professor.</p>
</section>

<div class="hub-cursos-wrap">
  <div id="hubCursosGrid"></div>
</div>

<footer>© 2026 · Francês na Mira</footer>

<script src="js/cursoHub.js"></script>
<script>
CursoHub.iniciar({
  modulo: "producao",
  proximaPagina: "correcoes-texto.html",
  async progresso(cursos) {
    const token = localStorage.getItem("token");
    const headers = { Authorization: "Bearer " + token };
    const mapa = new Map();
    try {
      // Quantidade de produções do curso = temas ativos disponíveis nele.
      const [resProducoes, ...resTemas] = await Promise.all([
        fetch("/api/producoes/minhas", { headers }),
        ...cursos.map(c => fetch("/api/temas?courseType=" + encodeURIComponent(c), { headers }))
      ]);
      if (!resProducoes.ok) return mapa;
      const producoes = await resProducoes.json();
      await Promise.all(cursos.map(async (curso, i) => {
        const temas = resTemas[i].ok ? await resTemas[i].json() : [];
        // Conta temas distintos: reenviar o mesmo tema não soma de novo.
        const idsTemas = new Set(temas.map(t => t._id));
        const enviadas = new Set(producoes
          .filter(p => p.temaId?.courseType === curso && idsTemas.has(p.temaId._id))
          .map(p => p.temaId._id)).size;
        const total = temas.length;
        mapa.set(curso, {
          rotulo: `${enviadas}/${total}`,
          percentual: total ? Math.round((enviadas / total) * 100) : 0
        });
      }));
    } catch (err) { /* progresso é só um bônus visual */ }
    return mapa;
  }
});
</script>
<script src="js/appShell.js"></script>
<script src="js/estudoTimerGlobal.js"></script>
<script src="js/theme-toggle.js"></script>
</body>
</html>
