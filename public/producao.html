<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="js/htmlSeguro.js"></script>
<script src="js/dialogos.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo-mira.png">
<title>Ambiente de Produção — Francês na Mira</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/producao-app.css">
<link rel="stylesheet" href="css/producao-app-site.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg-gradient); background-attachment: fixed; min-height: 100vh; color: var(--text); }
footer { text-align: center; padding: 28px; background: var(--footer-bg); margin-top: 40px; }
</style>
</head>
<body style="visibility:hidden;">
<script>window.CURSO_CONTEXTO_MODULO = "producao"; window.CURSO_CONTEXTO_HUB = "producao-hub.html";</script>
<script src="js/cursoContexto.js"></script>
<script src="js/producaoGate.js"></script>
<script>
  // O app começa quando o gate confirma o acesso e o curso escolhido no hub.
  window.FNM_PRONTO = window.ProducaoGate.pronto.then(function (r) { window.FNM_CURSO = r.curso; return r; });
</script>
<div id="app-navbar" class="app-navbar-bar"></div>

<div class="fnm-app" id="fnm-raiz">
  <!-- Barra de navegação do script: o app ainda usa os elementos (selos, permissões), mas a navegação é pelo hub e pela trilha. -->
  <header class="barra fnm-barra" hidden>
    <button class="marca" type="button" onclick="App.irAccueil()" aria-label="Accueil">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="20" r="11" fill="none" stroke="#E4C043" stroke-width="2.5"/><circle cx="20" cy="20" r="4" fill="#D51E28"/></svg>
      <span><b>Ambiente de Produção</b><small id="fnm-curso-rotulo">Français na Mira</small></span>
    </button>
    <nav class="barra-nav" id="barra-nav" hidden>
      <button type="button" onclick="App.irAccueil()">Accueil</button>
      <button type="button" onclick="App.abrirEcrit()">Production écrite</button>
      <button type="button" onclick="App.abrirOral()">Production orale</button>
      <button type="button" onclick="App.abrirDictee()">Dictée</button>
      <button type="button" onclick="App.abrirModeles()">Modèles écrits</button>
      <button type="button" onclick="App.abrirSimulados()">Simulados</button>
      <button type="button" onclick="App.abrirVocab()">Vocabulaire</button>
      <button type="button" id="nav-attentes" onclick="App.abrirAttentes()">Attentes du professeur</button>
      <button type="button" id="nav-intro" onclick="App.abrirIntro()" hidden>Introduction</button>
      <button type="button" id="nav-taches" onclick="App.abrirTarefas()" hidden>Mon espace <span class="selo-nav" id="selo-tarefas" hidden></span></button>
      <button type="button" id="nav-prof" onclick="App.abrirProf()" hidden>Espace professeur</button>
      <button type="button" class="sair" onclick="App.sair()">Changer de cours</button>
    </nav>
  </header>

  <div id="avisos-globais" class="avisos-globais" hidden></div>

  <main id="app">
    <section id="tela-accueil" class="tela ativa"><p class="vazio">Chargement de votre espace…</p></section>
    <section id="tela-liste" class="tela"></section>
    <section id="tela-modele" class="tela"></section>
    <section id="tela-axe" class="tela"></section>
    <section id="tela-outils" class="tela"></section>
    <section id="tela-epreuve" class="tela"></section>
    <section id="tela-notes" class="tela"></section>
    <section id="tela-prof" class="tela"></section>
    <section id="tela-carnet" class="tela"></section>
    <section id="tela-taches" class="tela"></section>
    <section id="tela-atelier" class="tela"></section>
    <section id="tela-hub" class="tela"></section>
  </main>

  <div id="dica" class="dica" role="tooltip" hidden></div>
</div>

<footer>© 2026 · Francês na Mira</footer>

<script>
  window.FNM_PRONTO.then(function (r) {
    var NOMES = { TCF: "TCF Canada", DELF: "DELF", DALF: "DALF", TEF: "TEF Canada", A1: "Français A1", A2: "Français A2", B1: "Français B1", B2: "Français B2" };
    document.getElementById("fnm-curso-rotulo").textContent = NOMES[r.curso] || r.curso;
  });
</script>
<script>
  // Altura da navbar fixa do site → --topo-site (barras fixas do app ficam logo abaixo dela).
  (function () {
    var medir = function () { var n = document.getElementById("app-navbar"); if (n) document.documentElement.style.setProperty("--topo-site", n.getBoundingClientRect().height + "px"); };
    window.addEventListener("resize", medir);
    if (window.ResizeObserver) new ResizeObserver(medir).observe(document.getElementById("app-navbar"));
    medir();
  })();
</script>
<script src="js/producaoI18n.js"></script>
<script>window.FNM_PRONTO = Promise.all([window.FNM_PRONTO, window.FNM_I18N_PRONTO]).then(function (r) { return r[0]; });</script>
<script src="js/gasShim.js"></script>
<script src="js/simuladoAoVivo.js"></script>
<script src="js/marcasAoVivo.js"></script>
<script src="js/producaoApp.js"></script>
<script src="js/appShell.js"></script>
<script src="js/estudoTimerGlobal.js"></script>
<script src="js/theme-toggle.js"></script>
</body>
</html>
