<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <script src="js/htmlSeguro.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo-mira.png">
<title>Planos-Base de Dever de Casa - Francês na Mira</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #2563eb; --azul-escuro: #1e40af; --azul-claro: #eff6ff; --azul-hover: #1d4ed8;
  --cinza-50: #f8fafc; --cinza-100: #f1f5f9; --cinza-200: #e2e8f0; --cinza-300: #cbd5e1;
  --cinza-400: #94a3b8; --cinza-600: #475569; --cinza-800: #1e293b; --branco: #ffffff;
  --verde: #16a34a; --verde-bg: #f0fdf4; --amarelo: #d97706; --amarelo-bg: #fffbeb;
  --vermelho: #dc2626; --vermelho-bg: #fef2f2;
  --sombra: 0 1px 3px rgba(15,23,42,0.08), 0 8px 24px rgba(15,23,42,0.06); --radius: 16px;
}
[data-theme="dark"] {
  --branco: #1e2433; --cinza-50: #161b28; --cinza-100: #232a3b; --cinza-200: #2d3548;
  --cinza-300: #3a4358; --cinza-400: #4b5568; --cinza-600: #9aa5bd; --cinza-800: #e8ecf5;
  --azul: #3b82f6; --azul-escuro: #2563eb; --azul-claro: rgba(59,130,246,0.18); --azul-hover: #60a5fa;
  --verde: #22c55e; --verde-bg: rgba(34,197,94,0.16);
  --vermelho: #f87171; --vermelho-bg: rgba(248,113,113,0.16);
  --amarelo: #fbbf24; --amarelo-bg: rgba(251,191,36,0.16);
}
body { font-family: 'Poppins', sans-serif; background: var(--cinza-50); color: var(--cinza-800); min-height: 100vh; }
header { font-family: 'Playfair Display', serif; font-size: 2.2rem; text-align: center; padding: 22px; background: var(--branco); border-bottom: 1px solid var(--cinza-200); }
header a { color: var(--azul-escuro); text-decoration: none; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 30px 3% 100px; }
.painel-header { background: linear-gradient(135deg, var(--azul-escuro), var(--azul)); color: white; border-radius: var(--radius); padding: 26px 32px; margin-bottom: 24px; box-shadow: var(--sombra); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
.painel-header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; }
.painel-header p { opacity: 0.9; font-size: 0.9rem; margin-top: 4px; }
.card { background: var(--branco); border: 1px solid var(--cinza-200); border-radius: var(--radius); box-shadow: var(--sombra); padding: 24px 26px; margin-bottom: 20px; }
.card h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 14px; }
.btn { padding: 10px 22px; border-radius: 30px; border: none; background: var(--azul); color: white; font-weight: 700; cursor: pointer; font-size: 0.88rem; }
.btn:hover { background: var(--azul-hover); }
.btn.secundario { background: var(--branco); color: var(--cinza-600); border: 1px solid var(--cinza-300); }
.btn.perigo { background: var(--vermelho-bg); color: var(--vermelho); border: 1px solid var(--vermelho); }
.btn.pequeno { padding: 7px 16px; font-size: 0.8rem; }
.voltar-link { display: inline-flex; gap: 6px; color: var(--azul); text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-bottom: 18px; cursor: pointer; }
.vazio-box { text-align: center; padding: 40px 20px; color: var(--cinza-400); }
.titulo-icone-inline { width: 1em; height: 1em; object-fit: contain; vertical-align: -0.14em; margin-right: 8px; }
.titulo-icone-inline.pequeno { margin-right: 5px; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
/* ---- lista de planos em cards ---- */
.planos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.plano-item { display: flex; flex-direction: column; gap: 12px; padding: 20px; border: 1px solid var(--cinza-200); border-radius: 16px; background: var(--branco); transition: border-color 0.2s, box-shadow 0.2s; }
.plano-item:hover { border-color: var(--azul); box-shadow: var(--sombra); }
.plano-item h4 { font-family: 'Playfair Display', serif; font-size: 1.12rem; line-height: 1.25; }
.plano-item .meta { font-size: 0.82rem; color: var(--cinza-400); }
.plano-item .desc { font-size: 0.84rem; color: var(--cinza-600); line-height: 1.5; }
.plano-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.plano-stats div { background: var(--cinza-50); border-radius: 10px; padding: 8px 4px; text-align: center; }
.plano-stats strong { display: block; font-size: 1.15rem; color: var(--azul-escuro); }
.plano-stats span { font-size: 0.66rem; color: var(--cinza-600); text-transform: uppercase; letter-spacing: 0.03em; }
.plano-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.plano-previa { display: none; border-top: 1px dashed var(--cinza-200); padding-top: 10px; font-size: 0.8rem; }
.plano-previa.show { display: block; }
.plano-previa li { list-style: none; padding: 4px 0; }
.plano-previa .sem { font-weight: 700; color: var(--cinza-800); }
.tag-dc { font-size: 0.66rem; font-weight: 700; padding: 1px 7px; border-radius: 8px; background: var(--verde-bg); color: var(--verde); margin-left: 4px; }
.filtro-planos { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.filtro-planos input { flex: 1; min-width: 200px; padding: 9px 14px; border-radius: 30px; border: 1px solid var(--cinza-300); font-family: inherit; background: var(--branco); color: var(--cinza-800); }
/* ---- editor: adicionar dever completo por semana ---- */
.dc-picker { display: none; margin: 10px 0; padding: 12px; border: 1px dashed var(--azul); border-radius: 12px; background: var(--azul-claro); }
.dc-picker.show { display: block; }
.dc-picker select { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--cinza-300); font-family: inherit; margin-bottom: 8px; background: var(--branco); color: var(--cinza-800); }
.semana-box.recolhida [data-atividades-wrap], .semana-box.recolhida .campo, .semana-box.recolhida .acoes-semana { display: none; }
.acoes-semana { display: flex; gap: 8px; flex-wrap: wrap; }
.resumo-semana { font-size: 0.78rem; color: var(--cinza-400); margin-left: 8px; font-weight: 400; }
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.campo label { font-size: 0.8rem; font-weight: 700; color: var(--cinza-600); }
.campo input, .campo select, .campo textarea { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--cinza-300); font-family: 'Poppins', sans-serif; font-size: 0.9rem; background: var(--branco); color: var(--cinza-800); }
.campo textarea { min-height: 60px; resize: vertical; }
.campo-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.semana-box { border: 1px solid var(--cinza-200); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; background: var(--cinza-50); }
.semana-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.semana-box-header h3 { font-size: 1rem; }
.atividade-box { border: 1px solid var(--cinza-200); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: var(--branco); transition: opacity 0.15s; }
.atividade-box.arrastando { opacity: 0.4; }
.atividade-box-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.drag-handle { cursor: grab; color: var(--cinza-400); font-size: 1rem; user-select: none; }
.drag-handle:active { cursor: grabbing; }
.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin-bottom: 10px; }
.msg-inline { padding: 10px 14px; border-radius: 10px; font-size: 0.86rem; margin-top: 10px; }
.msg-inline.sucesso { background: var(--verde-bg); color: var(--verde); }
.msg-inline.erro { background: var(--vermelho-bg); color: var(--vermelho); }
footer { text-align: center; padding: 24px; background: var(--branco); border-top: 1px solid var(--cinza-200); margin-top: 30px; font-size: 0.85rem; color: var(--cinza-400); }
</style>
<!-- Painel da equipe: padrão visual do site + navegação de volta (depois do estilo da página) -->
<link rel="stylesheet" href="css/painel-equipe.css">
</head>

<body style="visibility:hidden;">
<script>
(async function protegerPagina() {
  const token = localStorage.getItem('token');
  function bloquear(msg) {
    document.body.innerHTML = `
      <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; font-family:'Poppins',sans-serif; background:#f8fafc; color:#1e293b;">
        <h1 style="font-family:'Playfair Display',serif; font-size:2.2rem; margin-bottom:16px; color:#1e40af;">Acesso restrito</h1>
        <p style="font-size:1.1rem; max-width:480px; margin-bottom:28px; opacity:0.85;">${msg}</p>
        <a href="login.html" style="padding:14px 28px; background:#2563eb; color:white; border-radius:30px; text-decoration:none; font-weight:700;">Entrar</a>
      </div>`;
    document.body.style.visibility = 'visible';
  }
  if (!token) return bloquear('Esta página é exclusiva para professores e administradores.');
  try {
    const res = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) return bloquear('Sessão expirada. Entre novamente.');
    const data = await res.json();
    if (data.role !== 'professor' && data.role !== 'admin') return bloquear('Esta página é exclusiva para professores e administradores.');
    document.body.style.visibility = 'visible';
  } catch (err) { bloquear('Erro ao verificar sua conta.'); }
})();
</script>

<header><a href="index.html">Francês na Mira <img src="img/logo-mira.png" alt="" class="logo-mira-icone"></a></header>

<div class="wrap">
  <div class="painel-header">
    <div>
      <h1>Planos-Base de Dever de Casa</h1>
      <p>Modelos de semanas e atividades, incluindo deveres completos. Atribua a um aluno pela Gestão de Alunos.</p>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <a href="exercicios.html" class="btn secundario">Catálogo de deveres completos</a>
      <a href="gestao-alunos.html" class="btn secundario"><img class="titulo-icone-inline pequeno" src="img/icones/chevron-left.svg" alt="">Gestão de Alunos</a>
    </div>
  </div>

  <!-- ===================== LISTA ===================== -->
  <div id="viewLista">
    <div class="card">
      <div class="filtro-planos">
        <input type="text" id="buscaPlano" placeholder="Buscar plano por nome ou curso...">
        <button class="btn" id="novoPlanoBtn">+ Novo Plano-Base</button>
      </div>
      <div id="planosLista" class="planos-grid"></div>
    </div>
  </div>

  <!-- ===================== EDITOR ===================== -->
  <div id="viewEditor" style="display:none;">
    <span class="voltar-link" id="voltarListaBtn"><img class="titulo-icone-inline pequeno" src="img/icones/chevron-left.svg" alt="">Voltar à lista</span>
    <div class="card">
      <h2 id="editorTitulo">Novo Plano-Base</h2>
      <div class="campo"><label>Nome</label><input type="text" id="planoNome" placeholder="Ex.: Plano-base DELF B2"></div>
      <div class="campo-row">
        <div class="campo"><label>Curso</label><input type="text" id="planoCurso" placeholder="Ex.: DELF B2"></div>
      </div>
      <div class="campo"><label>Descrição</label><textarea id="planoDescricao"></textarea></div>
      <div id="planoErro" class="msg-inline erro" style="display:none;"></div>
    </div>

    <div id="semanasWrap"></div>

    <button class="btn secundario" id="addSemanaBtn" style="margin-bottom:20px;">+ Adicionar semana</button>

    <div style="display:flex; gap:12px;">
      <button class="btn" id="salvarPlanoBtn">Salvar Plano-Base</button>
    </div>
  </div>
</div>

<footer>© 2026 · Francês na Mira</footer>

<script src="js/deverAtividadeUI.js"></script>
<script src="js/admin-planos-base.js"></script>
<script src="js/theme-toggle.js"></script>
<script src="js/painelEquipe.js" defer></script>
</body>
</html>
