<!-- Painel da equipe: padrão visual do site + navegação de volta (depois do estilo da página) -->
<link rel="stylesheet" href="css/painel-equipe.css">
</head>
<body style="visibility:hidden;">
<script>
  // Espace professeur do Ambiente de Produção (painel da equipe): o mesmo app, aberto no modo professor.
  window.FNM_ABRIR = "prof";
  window.FNM_PRONTO = (async function () {
    const token = localStorage.getItem("token");
    const res = token ? await fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token } }).catch(() => null) : null;
    const conta = res && res.ok ? await res.json() : null;
    if (!conta || (conta.role !== "professor" && conta.role !== "admin")) { window.location.href = conta ? "minha-conta.html" : "login.html"; return new Promise(() => {}); }
    window.FNM_CURSO = "TCF";
    document.body.style.visibility = "visible";
    return { conta, curso: "TCF" };
  })();
</script>
<div id="app-navbar" class="app-navbar-bar"></div>

<div class="fnm-app" id="fnm-raiz">
  <!-- Barra de navegação do script: o app ainda usa os elementos (selos, permissões), mas a navegação é pelo hub e pela trilha. -->
  <header class="barra fnm-barra" hidden>
    <button class="marca" type="button" onclick="App.irAccueil()" aria-label="Accueil">

      <span><b>Espace professeur</b><small id="fnm-curso-rotulo">Ambiente de Produção</small></span>
    </button>
    <nav class="barra-nav" id="barra-nav" hidden>
      <button type="button" onclick="App.irAccueil()">Accueil</button>
      <button type="button" onclick="App.abrirEcrit()">Production écrite</button>
      <button type="button" onclick="App.abrirOral()">Production orale</button>

  <div id="dica" class="dica" role="tooltip" hidden></div>

<script>
  // Altura da navbar fixa do site → --topo-site (barras fixas do app ficam logo abaixo dela).
  (function () {
    var medir = function () { var n = document.getElementById("app-navbar"); if (n) document.documentElement.style.setProperty("--topo-site", n.getBoundingClientRect().height + "px"); };
    window.addEventListener("resize", medir);
    if (window.ResizeObserver) new ResizeObserver(medir).observe(document.getElementById("app-navbar"));
    medir();
  })();
</script>
